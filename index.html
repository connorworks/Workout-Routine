<script>
/* Standalone storage: stands in for Claude's page database by saving to this phone (localStorage). */
(function () {
  if (window.claude) return;
  var KEY = "ptb-db-v1";
  var SEED = { logs: {}, bodyweight: {} }; // History lives in the Google Sheet; a new device starts empty.
  var data;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!data) { data = SEED; save(); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  var subs = {};
  function snap(col) {
    var c = data[col] || {};
    return { metadata: { fromCache: false }, docs: Object.keys(c).map(function (k) { return { id: k, data: function () { return c[k]; } }; }) };
  }
  var db = {
    collection: function (col) {
      return { onSnapshot: function (cb) { (subs[col] = subs[col] || []).push(cb); setTimeout(function () { cb(snap(col)); }, 0); return function () {}; } };
    },
    doc: function (path) {
      var p = path.split("/");
      return { set: function (body) {
        data[p[0]] = data[p[0]] || {};
        data[p[0]][p[1]] = JSON.parse(JSON.stringify(body));
        save();
        try { if (window.WRSync) window.WRSync.mark(p[0], p[1]); } catch (e) {}
        (subs[p[0]] || []).forEach(function (cb) { cb(snap(p[0])); });
        return Promise.resolve();
      } };
    }
  };
  window.claude = { use: function () { return Promise.resolve(db); } };
  // Restore from the Sheet: saves a doc on this phone without queuing it to sync back.
  window.__wrPut = function (col, id, body) {
    data[col] = data[col] || {};
    data[col][id] = JSON.parse(JSON.stringify(body));
    save();
    (subs[col] || []).forEach(function (cb) { cb(snap(col)); });
  };
})();
</script>

  if (!get(INIT)) {
    var d0 = get(DB) || {};
    Object.keys(d0.logs || {}).forEach(function (id) { pending["logs/" + id] = stampOf(); });
    Object.keys(d0.bodyweight || {}).forEach(function (id) { pending["bodyweight/" + id] = stampOf(); });
    put(PEND, pending); put(INIT, true);
  }

  function count() { return Object.keys(pending).length; }

  // Restore: on a phone (or address) that's missing sessions the Sheet has, pull them back once.
  // Sessions already on this phone are never overwritten.
  var RESTORED = "wr-restore-v1" + (window.WR && window.WR.block && window.WR.block !== "Pre-Trek" ? ":" + window.WR.block : ""), restoring = false;
  function restore() {
    var pass = get(PASS);
    if (!SYNC_URL || !pass || get(RESTORED) || restoring || !window.WR || !window.WR.fromSheet || !window.__wrPut) return;
    restoring = true;
    fetch(SYNC_URL + "?read=1&block=" + encodeURIComponent(window.WR.block) + "&passcode=" + encodeURIComponent(pass))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        restoring = false;
        if (!res || !res.ok || !Array.isArray(res.sessions)) return; // an older sync script can't read yet; try again next time
        var d = get(DB) || {}, haveL = d.logs || {}, haveB = d.bodyweight || {}, n = 0;
        res.sessions.forEach(function (row) {
          var id = String(row[1] || "");
          if (!id || haveL[id]) return;
          var doc = window.WR.fromSheet(row, (res.sets || []).filter(function (x) { return String(x[1]) === id; }));
          if (doc) { window.__wrPut("logs", id, doc); n++; }
        });
        (res.bodyweight || []).forEach(function (row) {
          var wk = parseInt(row[1], 10), lb = Number(row[3]);
          if (!wk || !isFinite(lb) || row[3] === "" || haveB["w" + wk]) return;
          var dd = String(row[2] || "").slice(0, 10);
          window.__wrPut("bodyweight", "w" + wk, { week: wk, lb: lb, updatedAt: /^\d{4}-\d{2}-\d{2}$/.test(dd) ? dd + "T12:00:00.000Z" : new Date().toISOString() });
        });
        put(RESTORED, new Date().toISOString());
      }, function () { restoring = false; });
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(flush, ms); }
  function mark(col, id) {
    if (col !== "logs" && col !== "bodyweight" && col !== "maxes") return;
    pending[col + "/" + id] = stampOf();
    put(PEND, pending);
    show();
    schedule(2000);
  }

  function flush() {
    clearTimeout(timer); timer = null;
    if (!SYNC_URL || !count() || !window.WR) return show();
    var pass = get(PASS);
    if (!pass) return show();
    if (busy) { again = true; return; }
    var d = get(DB) || {}, sent = {}, body = { passcode: pass, sessions: [], bodyweight: [] };
    Object.keys(pending).forEach(function (k) {
      var i = k.indexOf("/"), col = k.slice(0, i), id = k.slice(i + 1), doc = (d[col] || {})[id];
      sent[k] = pending[k];
      if (col === "maxes") { try { body.maxes = window.WR.maxesOut(); } catch (e) {} return; }
      if (!doc) return;
      try {
        if (col === "logs") body.sessions.push(window.WR.rows(id, doc));
        else body.bodyweight.push(window.WR.bodyweightRow(id, doc));
      } catch (e) {}
    });
    body.sessions.sort(function (a, b) { return String(a.row[2]).localeCompare(String(b.row[2])) || String(a.id).localeCompare(String(b.id)); });
    busy = true; state = "busy"; show();
    fetch(SYNC_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        busy = false;
        if (res && res.ok) {
          Object.keys(sent).forEach(function (k) { if (pending[k] === sent[k]) delete pending[k]; });
          put(PEND, pending); put(LAST, new Date().toISOString());
          state = "";
        } else if (res && res.error === "passcode") {
          put(PASS, null); state = "badpass"; again = false;
          openDlg("That passcode didn't match the sync script. Check it and try again.");
        } else {
          state = "error";
        }
        show();
        if (again) { again = false; schedule(300); }
      }, function () {
        busy = false; state = navigator.onLine === false ? "offline" : "error"; show();
        if (again) { again = false; }
      });
  }

  // Header status
  var btn = document.getElementById("sync");
  function show() {
    if (!btn) return;
    if (!SYNC_URL) { btn.hidden = true; return; }
    btn.hidden = false;
    // Silent when syncing normally; only problems show.
    var n = count(), pass = get(PASS), t = "";
    if (!pass) t = state === "badpass" ? "Wrong passcode · tap to fix" : "Connect Sheet";
    else if (n && !busy && (state === "offline" || state === "error")) t = "Not syncing · tap to retry";
    btn.hidden = !t;
    btn.textContent = t;
    btn.className = "syncbtn warn";
  }
  if (btn) btn.addEventListener("click", function () {
    if (!get(PASS)) openDlg(); else flush();
  });

  // Passcode dialog
  var dlg = document.getElementById("syncdlg"), inp = document.getElementById("syncdlg-pass"), msg = document.getElementById("syncdlg-msg");
  var MSG = msg ? msg.textContent : "";
  function openDlg(err) {
    if (!dlg) return;
    msg.textContent = err || MSG; msg.className = err ? "err" : "muted";
    inp.value = ""; dlg.hidden = false;
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
  }
  function closeDlg() { if (dlg) dlg.hidden = true; }
  if (dlg) {
    document.getElementById("syncdlg-cancel").addEventListener("click", closeDlg);
    document.getElementById("syncdlg-save").addEventListener("click", function () {
      var v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      put(PASS, v); state = ""; closeDlg(); show(); restore(); loadProgram(); flush();
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("syncdlg-save").click(); });
  }

  // Retry when the phone comes back online or the app is reopened.
  window.addEventListener("online", function () { schedule(500); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") schedule(500); });
  window.addEventListener("pageshow", function () { schedule(800); });
  setInterval(function () { if (count() && !busy && document.visibilityState === "visible") flush(); }, 60000);

  // The program lives in the Sheet's Program tabs: fetched when the app opens and when it comes back on screen.
  var progAt = 0;
  function loadProgram() {
    var pass = get(PASS);
    if (!SYNC_URL || !pass || !window.WR || !window.WR.program || Date.now() - progAt < 15000) return;
    progAt = Date.now();
    fetch(SYNC_URL + "?program=1&passcode=" + encodeURIComponent(pass))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        // An older sync script answers without a program; the app keeps what it has.
        if (res && res.ok && Array.isArray(res.program)) {
          window.WR.program({ program: res.program, weeks: res.weeks || [], lifts: res.lifts || [] });
          // Training maxes: the Sheet's Maxes tab wins, unless a change made on this phone hasn't reached it yet.
          // An empty tab gets this phone's maxes.
          if (Array.isArray(res.maxes) && window.WR.maxes && !pending["maxes/all"] && !window.WR.maxes(res.maxes)) mark("maxes", "all");
        }
        // A wrong passcode shows up here first when nothing is waiting to send.
        else if (res && res.error === "passcode" && get(PASS) === pass) {
          put(PASS, null); state = "badpass"; show();
          openDlg("That passcode didn't match the sync script. Check it and try again.");
        }
      }, function () {});
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") loadProgram(); });

  window.WRSync = { mark: mark, flush: flush, restore: restore, program: loadProgram, pending: count };
  show();
  restore();
  loadProgram();
  schedule(1500);
})();
</script>
</body>
</html>
