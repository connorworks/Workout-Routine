<style>
/* Client workout app. The program comes from the coach's Google Sheet; logged sets go back to it. */
:root {
  --bg: #EDEFF2; --surface: #FFFFFF; --sunk: #F4F5F7; --ink: #14181D; --muted: #5A636F; --line: #D6DBE1;
  --accent: var(--brand, #1E4FD6); --accent-ink: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
  --ok: #1F7A4D; --ok-soft: #DDF1E6; --warn: #B4410C; --bar: #14181D; --bar-ink: #FFFFFF;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1115; --surface: #161A20; --sunk: #1C2128; --ink: #E7EBF0; --muted: #98A2AF; --line: #2A313A;
    --accent: color-mix(in srgb, var(--brand, #1E4FD6) 60%, #FFFFFF); --accent-ink: #0E1115;
    --ok: #5CC28E; --ok-soft: #173326; --warn: #F08A57; --bar: #1C2128; --bar-ink: #E7EBF0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1115; --surface: #161A20; --sunk: #1C2128; --ink: #E7EBF0; --muted: #98A2AF; --line: #2A313A;
  --accent: color-mix(in srgb, var(--brand, #1E4FD6) 60%, #FFFFFF); --accent-ink: #0E1115;
  --ok: #5CC28E; --ok-soft: #173326; --warn: #F08A57; --bar: #1C2128; --bar-ink: #E7EBF0; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2, h3 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 30px; line-height: 1; }
h3 { font-size: 20px; line-height: 1.05; }
p { margin: 0; }
[hidden] { display: none !important; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

.app { max-width: 560px; margin: 0 auto; min-height: calc(100vh + 1px); padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top .t { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; margin-top: 4px; }
.top .t .td { margin-left: 10px; font-family: var(--body); font-size: 14px; font-weight: 600; text-transform: none; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.sync.warn { color: var(--warn); font-weight: 600; }
main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card.hero { border-top: 5px solid var(--accent); }
.banner { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.banner button { background: none; border: none; padding: 0 2px; color: var(--muted); font-size: 18px; line-height: 1; }
.btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 17px; background: var(--accent); color: var(--accent-ink); text-align: center; text-decoration: none; }
.btn.ghost { background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.linkbtn { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 15px; text-align: left; }
.exlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.exlist .b { display: inline-block; min-width: 26px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.prog { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); }

.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.srow-btn { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; background: none; border: none; border-top: 1px solid var(--line); padding: 14px 16px; }
.srow-btn:first-child { border-top: none; }
.srow-btn .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.srow-btn .n { font-weight: 700; font-size: 17px; }
.srow-btn .st { grid-row: 1 / span 2; grid-column: 2; }
.srow-btn.next { background: var(--accent-soft); }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.prog-p { background: var(--accent-soft); color: var(--accent); }
.weeks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.weeks::-webkit-scrollbar { display: none; }
.wk { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 15px; }
.wk[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wk .d { font-size: 11px; font-weight: 600; margin-left: 6px; color: var(--ok); }

.back { align-self: flex-start; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
/* A superset (B1, B2…) is one connected bubble. */
.durrow { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.durrow .dl { font-weight: 600; color: var(--ink); }
.durrow input { width: 88px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); font: inherit; font-size: 16px; text-align: center; caret-color: transparent; cursor: pointer; }
.ss { display: flex; flex-direction: column; }
.ss > .item { border-radius: 0; }
.ss > .item + .item { border-top: 1px dashed var(--line); }
.ss > .item:not(:first-child) { border-top-width: 1px; margin-top: -1px; }
.ss > .item:first-child { border-radius: 18px 18px 0 0; }
.ss > .item:last-child { border-radius: 0 0 18px 18px; }
.iname { display: flex; align-items: baseline; gap: 10px; }
.iname .b { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 7px; padding: 1px 7px; flex: none; }
.iname .n { font-weight: 700; font-size: 18px; line-height: 1.25; }
.rx { font-family: var(--mono); font-size: 13.5px; color: var(--muted); }
.cnote { font-size: 14px; background: var(--sunk); border-radius: 10px; padding: 8px 11px; }
.last { display: flex; justify-content: space-between; gap: 10px; width: 100%; background: none; border: none; padding: 0; text-align: left; font-size: 13px; color: var(--muted); }
.last .v { font-family: var(--mono); color: var(--accent); text-align: right; }
.last .chev { font-size: 10px; margin-left: 4px; display: inline-block; transition: transform .15s; }
.last[aria-expanded="true"] .chev { transform: rotate(180deg); }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 13px; align-items: baseline; }
.hist .hd { color: var(--muted); white-space: nowrap; }
.hist .hv { font-family: var(--mono); font-size: 12.5px; }

.sets { display: flex; flex-direction: column; gap: 8px; }
.shead, .srow { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.shead span { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; letter-spacing: .06em; text-transform: uppercase; }
.shead span:first-child { text-align: left; }
.srow .sn { font-family: var(--mono); font-size: 17px; }
.srow input { width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); caret-color: transparent; -webkit-user-select: none; user-select: none; cursor: pointer;
  font-family: var(--mono); font-size: 19px; text-align: center; padding: 0 6px; -webkit-appearance: none; appearance: none; }
.srow input::placeholder { color: var(--muted); opacity: .6; }
.srow input:focus { outline: none; }
.srow input.on { border: 2px solid var(--accent); color: var(--ink); }
.srow.ck input { color: var(--ink); }
.wbox { position: relative; min-width: 0; }
.wbox .pct { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); pointer-events: none; }
.wbox.has-pct input { padding-left: 34px; }
.ck-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ok); background: none; display: grid; place-items: center; justify-self: end; padding: 0; color: var(--ok); }
.ck-btn svg { width: 20px; height: 20px; opacity: 0; }
.ck-btn[aria-pressed="true"] { background: var(--ok); color: var(--surface); }
.ck-btn[aria-pressed="true"] svg { opacity: 1; }
.ck-all { width: 36px; height: 36px; border-width: 1.5px; }
.ck-all svg { opacity: .55; }
textarea { width: 100%; min-height: 90px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); font: inherit; padding: 10px 12px; resize: vertical; }
.small { font-size: 14px; }
.pill.miss { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--warn); }
.missed .mrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.missed .mrow:first-of-type { border-top: none; padding-top: 0; }
.mtxt { display: flex; flex-direction: column; gap: 2px; background: none; border: none; padding: 0; text-align: left; min-width: 0; }
.mtxt .n { font-weight: 700; font-size: 17px; }
.mtxt .d { font-size: 13px; color: var(--muted); }
.btn.small-btn { width: auto; flex: none; min-height: 44px; padding: 0 16px; font-size: 15px; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.move { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.mvdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
.mvd { display: flex; flex-direction: column; align-items: center; padding: 6px 0; min-height: 50px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); font-weight: 700; font-size: 12px; color: var(--ink); }
.mvd small { font-family: var(--mono); font-weight: 400; color: var(--muted); font-size: 13px; }
.mvd[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mvd[aria-pressed="true"] small { color: var(--accent-ink); }
.hype { border-radius: 18px; padding: 16px 18px; background: var(--accent); color: var(--accent-ink); }
.hype-line { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; text-wrap: balance; letter-spacing: .01em; }
.sesshead { display: flex; flex-direction: column; gap: 6px; }
.running { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 15px; font-weight: 600; }
.running .mono { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--accent); }
.lastcard { display: flex; flex-direction: column; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); padding: 2px 14px; }
.lastcard .lr { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lastcard .lr + .lr { border-top: 1px solid var(--line); }
.lastcard .lr > span:first-child { white-space: nowrap; }
.lastcard .lv { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent); text-align: right; }
.lastcard .lv.muted { color: var(--muted); font-weight: 500; }
.lrbtn { width: 100%; background: none; border: none; border-top: 1px solid var(--line); margin: 0; font-family: inherit; text-align: left; }
.lastcard > .lrbtn:first-child { border-top: none; }
.lrbtn .chev { display: inline-block; margin-left: 6px; font-size: 11px; transition: transform .15s; }
.lrbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.lastcard .hist { padding-bottom: 8px; }
.card h3 { font-family: var(--body); text-transform: none; font-weight: 700; font-size: 19px; letter-spacing: 0; }
.hsub { font-size: 13px; color: var(--muted); margin-top: -8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat::before { content: ""; width: 22px; height: 3px; border-radius: 2px; background: var(--accent); margin-bottom: 6px; }
.stat .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 2px; align-items: end; height: 120px; border-bottom: 1px solid var(--line); }
.barc { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; background: none; border: none; padding: 0 6px; }
.barc .bf { width: 100%; max-width: 44px; background: var(--accent); border-radius: 4px 4px 0 0; }
.barc[aria-pressed="true"] .bf { outline: 2px solid var(--ink); outline-offset: 2px; }
.barx { display: grid; gap: 2px; text-align: center; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.barx .now { color: var(--ink); font-weight: 600; }
.readout { font-family: var(--mono); font-size: 13px; color: var(--muted); min-height: 1.4em; }
.mlrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.mlrow:first-of-type { border-top: none; }
.mlrow .n { font-weight: 700; }
.mlrow .e { font-family: var(--mono); font-weight: 600; text-align: right; }
.mlrow .d { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.meter { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); border-radius: 3px; }
.linkbtn.center { align-self: center; text-align: center; }
.card.summary { gap: 10px; }
.donebadge { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 5px 12px 5px 8px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; animation: pop .35s ease-out; }
.donebadge svg { width: 18px; height: 18px; }
@keyframes pop { 0% { transform: scale(.85); opacity: 0; } 70% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .donebadge { animation: none; } }
.sumstats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 4px -18px 0; }
.sumstats .sst { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px 12px 18px; min-width: 0; }
.sumstats .sst + .sst { border-left: 1px solid var(--line); }
.sumstats .ssl { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sumstats .ssv { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; white-space: nowrap; }
.sumbest { padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 4px; }
.sumbest .eyebrow { color: var(--accent); }
.sbrow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; }
.sbrow .m { font-family: var(--mono); font-size: 12.5px; color: var(--accent); white-space: nowrap; }
.sumlist { list-style: none; margin: 0; padding: 0; }
.sumlist li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sumlist li:first-child { border-top: none; }
.sumlist .n { font-weight: 600; }
.sumlist .v { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; }
.sumnotes { padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 14px; white-space: pre-wrap; }
.resetbtn { align-self: center; background: none; border: none; padding: 8px 12px; color: var(--warn); font-weight: 600; font-size: 14px; border-radius: 10px; }
.resetbtn.armed { background: var(--warn); color: #FFFFFF; }

details.lh { border-top: 1px solid var(--line); }
details.lh:first-of-type { border-top: none; }
details.lh > summary { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; list-style: none; cursor: pointer; align-items: baseline; }
details.lh > summary::-webkit-details-marker { display: none; }
details.lh > summary .n { font-weight: 700; }
details.lh > summary .n::after { content: "▾"; font-size: 11px; color: var(--muted); margin-left: 6px; display: inline-block; transition: transform .15s; }
details.lh[open] > summary .n::after { transform: rotate(180deg); }
details.lh > summary .c { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
details.lh .hist { padding-bottom: 12px; }

/* Number pad, same as the personal app: digits on the left, a big check on the right that logs the set. */
.kp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: #1C2128; color: #E7EBF0; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); --kpa: color-mix(in srgb, var(--brand, #1E4FD6) 60%, #FFFFFF); }
.kp[hidden] { display: none; }
.kp-in { max-width: 520px; margin: 0 auto; }
.kp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kp-k { aspect-ratio: 1.35; border-radius: 999px; border: 1px solid #3A424D; background: transparent; color: #E7EBF0; font-family: var(--body); font-size: 26px; display: grid; place-items: center; padding: 0; }
.kp-k:active { background: #2A313A; }
.kp-k svg, .kp-ok svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.kp-k svg { width: 26px; height: 26px; stroke-width: 2; }
.kp-ok { grid-row: span 3; border-radius: 28px; border: none; background: var(--kpa); color: #0E1115; display: grid; place-items: center; padding: 0; }
.kp-ok svg { width: 34px; height: 34px; stroke-width: 2.6; }
.kp-ok:active { filter: brightness(.9); }
body.kp-open .app { padding-bottom: calc(var(--kph, 360px) + 40px); }
body.kp-open .rest { bottom: var(--kph, 360px); z-index: 36; }
.rest { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 6; max-width: 560px; margin: 0 auto;
  background: var(--bar); color: var(--bar-ink); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 16px 16px 0 0; }
.rest .l { font-size: 11px; letter-spacing: .12em; font-weight: 600; text-transform: uppercase; opacity: .75; }
.rest .tm { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.1; }
.rest .bt { display: flex; gap: 8px; }
.rest button { background: none; border: 1px solid currentColor; border-radius: 12px; padding: 9px 14px; font-weight: 700; color: inherit; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: none; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 8; background: var(--bar); color: var(--bar-ink);
  border-radius: 99px; padding: 10px 18px; font-weight: 600; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.foot { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="eyebrow" id="gym">Workouts</div><div class="t" id="vt">Today</div></div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="view"></main>
</div>
<div class="kp" id="kp" hidden role="dialog" aria-label="Number pad">
  <div class="kp-in">
    <div class="kp-grid">
      <button class="kp-k" type="button" data-d="1">1</button><button class="kp-k" type="button" data-d="2">2</button><button class="kp-k" type="button" data-d="3">3</button><button class="kp-k" type="button" data-d="del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button>
      <button class="kp-k" type="button" data-d="4">4</button><button class="kp-k" type="button" data-d="5">5</button><button class="kp-k" type="button" data-d="6">6</button><button class="kp-ok" type="button" id="kp-ok" aria-label="Log this set"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
      <button class="kp-k" type="button" data-d="7">7</button><button class="kp-k" type="button" data-d="8">8</button><button class="kp-k" type="button" data-d="9">9</button>
      <button class="kp-k" type="button" data-d=".">.</button><button class="kp-k" type="button" data-d="0">0</button><button class="kp-k" type="button" id="kp-close" aria-label="Close number pad"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>
</div>
<div class="rest" id="rest" hidden>
  <div><div class="l" id="rest-l">Rest</div><div class="tm" id="rest-t">0:00</div></div>
  <div class="bt"><button type="button" id="rest-add">+30s</button><button type="button" id="rest-skip">Skip</button></div>
</div>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Today</button>
  <button type="button" data-v="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Program</button>
  <button type="button" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>History</button>
</nav>
<script>
(function () {
  "use strict";
  var VERSION = "17";

  // Sample program for ?demo, so anyone can try the app without a coach's sheet.
  var DEMO_DATA = {
    ok: true,
    client: { name: "Demo Client", start: (function () { var d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); })(), days: "Mon, Wed, Fri" },
    settings: { gym: "Demo Gym", coach: "Coach" },
    maxes: { "Back squat": 275, "Bench press": 205 },
    history: [],
    program: (function () {
      var out = [], pct = ["70%", "72.5%", "75%"], dl = ["185", "195", "205"];
      for (var w = 1; w <= 3; w++) {
        out.push({ id: "w" + w + "-day-1", week: String(w), day: "Day 1", title: "Lower", items: [
          { block: "A", n: "Back squat", sets: "4", reps: "6", load: pct[w - 1], rest: "2 min", notes: "Brace before every rep. Hit depth." },
          { block: "B1", n: "Romanian deadlift", sets: "3", reps: "8", load: "135", rest: "", notes: "" },
          { block: "B2", n: "Walking lunge", sets: "3", reps: "10 each", load: "25", rest: "90s", notes: "Dumbbells in each hand." },
          { block: "C", n: "Plank", sets: "3", reps: "30 sec", load: "", rest: "45s", notes: "" } ] });
        out.push({ id: "w" + w + "-day-2", week: String(w), day: "Day 2", title: "Upper", items: [
          { block: "A", n: "Bench press", sets: "4", reps: "6", load: pct[w - 1], rest: "2 min", notes: "" },
          { block: "B1", n: "DB row", sets: "3", reps: "10", load: "50", rest: "", notes: "" },
          { block: "B2", n: "Push-up", sets: "3", reps: "AMRAP", load: "BW", rest: "90s", notes: "" } ] });
        out.push({ id: "w" + w + "-day-3", week: String(w), day: "Day 3", title: "Full body", items: [
          { block: "A", n: "Trap bar deadlift", sets: "3", reps: "5", load: dl[w - 1], rest: "2 min", notes: "" },
          { block: "B", n: "Lat pulldown", sets: "3", reps: "12/10/8", load: "100/110/120", rest: "75s", notes: "Heavier each set." } ] });
      }
      return out;
    })()
  };

  // ---------- Storage on this phone ----------
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // Link: ?k=<coach's script id>&c=<client code>. Saved so the Home Screen app keeps working without them.
  var qs = new URLSearchParams(location.search);
  var DEMO = qs.has("demo");
  var cfg = load("coach-cfg") || {};
  if (qs.get("c")) {
    cfg = { k: qs.get("k") || cfg.k || "", c: qs.get("c"), api: localApi(qs.get("api")) };
    save("coach-cfg", cfg);
  }
  function localApi(u) { return u && /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//.test(u) ? u : ""; }
  var WHO = DEMO ? "demo" : (cfg.c || "");
  var API = DEMO ? "" : (cfg.api || (cfg.k ? "https://script.google.com/macros/s/" + encodeURIComponent(cfg.k) + "/exec" : ""));
  var DKEY = "coach-data-" + WHO, LKEY = "coach-logs-" + WHO, QKEY = "coach-queue-" + WHO;

  var data = DEMO ? DEMO_DATA : load(DKEY);
  var logs = load(LKEY) || {};
  var queue = load(QKEY) || {};
  var view = "today", sel = null, pickWeek = null, loadError = "", syncState = "", M = null, R = null, MV = {}, PL = null;

  // ---------- Small helpers ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
  function slug(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  function round5(x) { return Math.round(x / 5) * 5; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function isoDay(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtDay(iso) {
    var m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(iso || "");
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }
  function splitList(s) { s = String(s || "").trim(); return s ? s.split(/\s*[\/,]\s*/).filter(Boolean) : []; }
  function firstName() { var n = data && data.client && data.client.name || ""; return n.split(/\s+/)[0]; }
  function coachName() { return (data && data.settings && data.settings.coach) || "your coach"; }
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>';
  var CHECK2_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.5 6.5 17 15 7.5M11 15.5l1.5 1.5L22 7.5"/></svg>';

  // ---------- Program model ----------
  // The four main barbell lifts the coach keeps maxes for on the Clients tab.
  var LIFTS = ["Bench", "Squat", "Deadlift", "Clean"];
  function liftOf(n) {
    var t = String(n || "").toLowerCase();
    if (/\b(db|dumbbell|kb|kettlebell)\b/.test(t)) return null;
    if (/clean/.test(t)) return "Clean";
    if (/deadlift/.test(t) && !/romanian|rdl|stiff|single|\bsl\b/.test(t)) return "Deadlift";
    if (/bench/.test(t) && !/incline|decline|close/.test(t)) return "Bench";
    if (/squat/.test(t) && !/goblet|split|bulgarian|front|overhead|jump|box|pistol|hack|belt/.test(t)) return "Squat";
    return null;
  }
  function maxFor(n) {
    var mx = (data && data.maxes) || {}, k = norm(n), best = null;
    Object.keys(mx).forEach(function (m) { if (norm(m) === k) best = mx[m]; });
    if (best == null && liftOf(n) && mx[liftOf(n)] > 0) best = mx[liftOf(n)];
    return best;
  }
  function restSecs(s) {
    s = String(s || "").toLowerCase();
    var mm = s.match(/(\d+):(\d{2})/);
    if (mm) return +mm[1] * 60 + +mm[2];
    var n = parseFloat(s);
    if (!(n > 0)) return 0;
    return /m/.test(s) && !/ms/.test(s) ? Math.round(n * 60) : Math.round(n);
  }
  // One exercise row from the sheet, turned into per-set targets.
  function parseItem(it) {
    var reps = splitList(it.reps), loads = splitList(it.load);
    var sets = parseInt(it.sets, 10);
    if (!(sets > 0)) sets = Math.max(reps.length, loads.length, 1);
    var isPct = loads.some(function (x) { return /%/.test(x); });
    var max = isPct ? maxFor(it.n) : null;
    var per = [];
    for (var i = 0; i < sets; i++) {
      var rt = reps.length ? reps[Math.min(i, reps.length - 1)] : "";
      var lt = loads.length ? loads[Math.min(i, loads.length - 1)] : "";
      var num = parseFloat(String(lt).replace(/[^0-9.]/g, ""));
      var p = isPct && !isNaN(num) ? num : null;
      var w = p != null ? (max ? round5(max * p / 100) : null) : (/^\s*\d/.test(lt) && !isNaN(num) ? num : null);
      var rn = parseInt(rt, 10);
      per.push({ reps: rt, rFill: isNaN(rn) ? null : rn, pct: p, w: w, text: p == null && w == null ? lt : "",
        target: (rt || "") + (p != null ? " @ " + p + "%" : w != null ? " @ " + w + " lb" : lt ? " @ " + lt : "") });
    }
    var rx = sets + " × " + (it.reps || "—") + (it.load ? " · " + it.load + (isPct && max ? " of " + max : "") : "") + (it.rest ? " · Rest " + it.rest : "");
    return { block: it.block || "", n: it.n, notes: it.notes || "", rest: restSecs(it.rest), sets: sets, per: per, rx: rx };
  }
  function model() {
    if (M) return M;
    var sessions = ((data && data.program) || []).map(function (s) {
      var used = {};
      var items = (s.items || []).map(function (it) {
        var x = parseItem(it), k = slug((it.block || "") + "-" + it.n) || "x";
        while (used[k]) k += "-2";
        used[k] = 1; x.key = k;
        return x;
      });
      return { id: s.id, week: String(s.week), day: s.day || "", title: s.title || s.day || "", items: items };
    });
    var weeks = [];
    sessions.forEach(function (s) { if (weeks.indexOf(s.week) < 0) weeks.push(s.week); });
    M = { sessions: sessions, weeks: weeks, byId: {} };
    sessions.forEach(function (s) { M.byId[s.id] = s; });
    return M;
  }
  // Sessions already in the coach's sheet (from this phone or another one).
  function remote() {
    if (R) return R;
    R = {}; MV = {};
    ((data && data.history) || []).forEach(function (r) {
      var id = String(r[0] || ""); if (!id) return;
      if (r[5] === "Moved") { MV[id] = String(r[1] || ""); return; }
      var s = R[id] || (R[id] = { date: String(r[1] || ""), status: String(r[5] || ""), notes: "", minutes: null, ex: {}, order: [] });
      if (r[5] === "Done") s.status = "Done";
      if (r[12]) s.notes = String(r[12]);
      if (r[14] !== "" && r[14] != null && isFinite(Number(r[14]))) s.minutes = Number(r[14]);
      var n = String(r[6] || ""); if (!n) return;
      if (!s.ex[n]) { s.ex[n] = []; s.order.push(n); }
      s.ex[n].push({ set: parseInt(r[7], 10) || s.ex[n].length + 1, w: r[9] === "" || r[9] == null ? null : Number(r[9]), r: r[10] === "" || r[10] == null ? null : Number(r[10]), done: r[11] === true || r[11] === "TRUE" });
    });
    return R;
  }
  function logOf(id) { return logs[id] || (logs[id] = { items: {}, notes: "", status: "" }); }
  function itemLog(id, key) {
    var lg = logOf(id);
    return lg.items[key] || (lg.items[key] = { w: [], r: [], ck: [] });
  }
  // A session counts as logged on this phone once a set is checked or it's finished; otherwise the sheet's copy wins.
  function anyChecked(lg) { return Object.keys(lg.items).some(function (k) { return lg.items[k].ck.some(Boolean); }); }
  // Started means a set is checked, the clock was started, or it's finished. A reset workout is not started.
  function localStarted(lg) { return !!(lg && (lg.status === "Done" || lg.startedAt || anyChecked(lg))); }
  function remoteStarted(id) {
    var r = remote()[id];
    return !!(r && (r.status === "Done" || r.minutes || r.order.some(function (n) { return r.ex[n].some(function (x) { return x.done; }); })));
  }
  // This phone's copy wins once it has anything (including a reset) over what the sheet sent.
  function hasLocal(id) {
    var lg = logs[id];
    return !!(lg && (lg.status || lg.cleared || anyChecked(lg)));
  }
  function isDone(id) {
    if (hasLocal(id)) return logs[id].status === "Done";
    return !!(remote()[id] && remote()[id].status === "Done");
  }
  function isStarted(id) { return hasLocal(id) ? localStarted(logs[id]) : remoteStarted(id); }
  function nextSession() {
    var s = model().sessions;
    for (var i = 0; i < s.length; i++) if (!isDone(s[i].id)) return s[i];
    return null;
  }
  function sessLabel(s) { return "Week " + s.week + (s.day && s.day !== s.title ? " · " + s.day : ""); }

  // Every logged session of one exercise, newest first: local logs first, then rows from the sheet.
  function historyOf(name, exceptId) {
    var key = norm(name), out = [], seen = {};
    Object.keys(logs).forEach(function (id) {
      if (id === exceptId) return;
      var s = model().byId[id], lg = logs[id];
      if (!s) return;
      s.items.forEach(function (it) {
        if (norm(it.n) !== key) return;
        var v = lg.items[it.key]; if (!v) return;
        var sets = [];
        for (var i = 0; i < it.sets; i++) if (v.ck[i] && (v.w[i] != null || v.r[i] != null)) sets.push({ w: v.w[i], r: v.r[i] });
        if (sets.length) { out.push({ id: id, date: lg.date || "", n: it.n, txt: setText(sets) }); seen[id] = 1; }
      });
    });
    var rem = remote();
    Object.keys(rem).forEach(function (id) {
      if (id === exceptId || seen[id] || hasLocal(id)) return;
      var s = rem[id];
      s.order.forEach(function (n) {
        if (norm(n) !== key) return;
        var sets = s.ex[n].filter(function (x) { return x.done && (x.w != null || x.r != null); });
        if (sets.length) out.push({ id: id, date: s.date, n: n, txt: setText(sets) });
      });
    });
    out.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    return out;
  }
  function same(a) { return a.length && a.every(function (x) { return x === a[0]; }); }
  function setText(sets) {
    var ws = sets.map(function (x) { return x.w; }), rs = sets.map(function (x) { return x.r == null ? "?" : x.r; });
    var hasW = ws.some(function (x) { return !!x; });
    return sets.length + " × " + (same(rs) ? rs[0] : rs.join(", ")) +
      (hasW ? " @ " + (same(ws) ? ws[0] : ws.map(function (x) { return x == null ? "–" : x; }).join(", ")) + " lb" : "");
  }
  function histList(entries, label) {
    var ul = el("ul", "hist");
    entries.forEach(function (e) {
      var li = el("li");
      li.appendChild(el("span", "hd", e.date ? fmtDay(e.date) : "—"));
      li.appendChild(el("span", "hv", (e.n !== label ? e.n + " · " : "") + e.txt));
      ul.appendChild(li);
    });
    return ul;
  }

  // ---------- Sync with the coach's sheet ----------
  function rowsFor(id) {
    var s = model().byId[id], lg = logs[id];
    if (!s || !lg) return [];
    if (!localStarted(lg)) return lg.moved ? [[id, lg.moved, s.week, s.day, s.title, "Moved", "", "", "", "", "", false, "", "", ""]] : [];
    var head = [id, lg.date || isoDay(), s.week, s.day, s.title, lg.status || "In progress"];
    var rows = [];
    s.items.forEach(function (it) {
      var v = lg.items[it.key];
      if (!v) return;
      for (var i = 0; i < it.sets; i++) {
        if (v.w[i] == null && v.r[i] == null && !v.ck[i]) continue;
        rows.push(head.concat([it.n, i + 1, it.per[i].target, v.w[i] == null ? "" : v.w[i], v.r[i] == null ? "" : v.r[i], !!v.ck[i], ""]));
      }
    });
    if (!rows.length) rows.push(head.concat(["", "", "", "", "", false, ""]));
    rows[0][12] = lg.notes || "";
    rows[0][13] = "";
    rows[0][14] = lg.minutes != null ? lg.minutes : "";
    return rows;
  }
  var syncTimer = null, seq = 0;
  function queueSync(id, now) {
    queue[id] = ++seq + Date.now();
    save(QKEY, queue);
    clearTimeout(syncTimer);
    syncTimer = setTimeout(flush, now ? 0 : 1500);
  }
  function flush() {
    if (DEMO || !API || !cfg.c) return;
    var ids = Object.keys(queue);
    if (!ids.length) return;
    if (navigator.onLine === false) { setSync("offline"); return; }
    var sent = {};
    ids.forEach(function (id) { sent[id] = queue[id]; });
    setSync("saving");
    fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ client: cfg.c, sessions: ids.map(function (id) { return { id: id, rows: rowsFor(id) }; }) }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) {
          ids.forEach(function (id) { if (queue[id] === sent[id]) delete queue[id]; });
          save(QKEY, queue);
          setSync(Object.keys(queue).length ? "saving" : "saved");
          if (Object.keys(queue).length) { clearTimeout(syncTimer); syncTimer = setTimeout(flush, 800); }
        } else setSync(res && res.error === "unknown-client" ? "badlink" : "error");
      })
      .catch(function () { setSync("offline"); });
  }
  function setSync(s) {
    syncState = s;
    // Silent when saving works; only problems show.
    var t = { offline: "Offline · will send later", error: "Couldn't save · will retry", badlink: "Link not active" }[s] || "";
    if (DEMO) t = "";
    var e = document.getElementById("sync");
    e.textContent = t;
    e.className = "sync" + (s === "offline" || s === "error" || s === "badlink" ? " warn" : "");
  }
  function refresh(quiet) {
    if (DEMO || !API || !cfg.c) return;
    // Google reserves "c" and "sid" on script addresses, so the code goes as "client".
    fetch(API + "?client=" + encodeURIComponent(cfg.c))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        // A sheet script that answers but sends no program is an older or unfinished setup.
        if (res && res.ok && !Array.isArray(res.program)) res = { ok: false, error: "setup" };
        if (!res || !res.ok) {
          loadError = (res && res.error) || "error";
          if (loadError === "unknown-client") setSync("badlink");
          if (!data || loadError === "unknown-client" || loadError === "setup") render();
          return;
        }
        loadError = "";
        var changed = JSON.stringify(res) !== JSON.stringify(data);
        data = res; M = null; R = null; PL = null;
        // A reset has reached the sheet once the sheet no longer shows the workout as started.
        Object.keys(logs).forEach(function (id) { if (logs[id].cleared && !queue[id] && !remoteStarted(id)) delete logs[id].cleared; });
        save(DKEY, data);
        brand();
        if (changed && !quiet && !typing()) render();
        // While the app is open, redraw in place and keep the scroll position; wait if a timer or the keypad is up.
        else if (changed && quiet && !busy()) { var y = window.scrollY; render(); window.scrollTo(0, y); }
        flush();
      })
      .catch(function () { if (!data) { loadError = "offline"; render(); } });
  }
  function typing() { var a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"); }

  // ---------- Look ----------
  function brand() {
    var s = (data && data.settings) || {};
    var gym = s.gym || "Workouts";
    document.getElementById("gym").textContent = gym;
    document.title = gym;
    document.getElementById("apptitle").setAttribute("content", gym);
    if (/^#[0-9a-f]{6}$/i.test(s.color || "")) document.documentElement.style.setProperty("--brand", s.color);
  }

  // ---------- Rest timer ----------
  var restEnd = 0, restTick = null;
  function startRest(secs, label) {

    var c = el("section", "card");
    if (!groups.length) {
      c.appendChild(el("p", "muted", "Your lifts show up here after your first workout."));
      viewEl.appendChild(c); return;
    }
    groups.sort(function (a, b) { return String(b.list[0].date).localeCompare(String(a.list[0].date)) || a.n.localeCompare(b.n); });
    c.appendChild(el("h3", null, "Lift history"));
    c.appendChild(el("p", "hsub", "Tap a lift to see every session."));
    groups.forEach(function (g) {
      var d = el("details", "lh"), sm = el("summary");
      sm.appendChild(el("span", "n", g.n));
      sm.appendChild(el("span", "c", g.list.length + (g.list.length === 1 ? " session" : " sessions") + (g.list[0].date ? " · " + fmtDay(g.list[0].date).replace(/^\w+, /, "") : "")));
      d.appendChild(sm); d.appendChild(histList(g.list, g.n));
      c.appendChild(d);
    });
    viewEl.appendChild(c);
    viewEl.appendChild(el("div", "foot", (data.client && data.client.name ? data.client.name + " · " : "") + "v" + VERSION));
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { view = b.dataset.v; sel = null; render(); window.scrollTo(0, 0); });
  });
  window.addEventListener("online", flush);
  // ---------- Staying current ----------
  // Only when the app opens or comes back on screen (no timers): it re-reads the sheet and checks for a newer
  // version of itself. A new version reloads the page right then, back on the same screen, unless a rest timer
  // or the keypad is up; then it waits for the next time. Logs are saved on the phone, so nothing is lost.
  var newVersion = false, UIKEY = "coach-ui";
  function busy() { return (restEnd && Date.now() < restEnd + 3000) || document.body.classList.contains("kp-open") || typing(); }
  function checkVersion() {
    if (location.protocol === "file:") return;
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) {
        var m = t.match(/var VERSION = "(\d+)"/);
        if (m && +m[1] > +VERSION) { newVersion = true; maybeReload(); }
      })
      .catch(function () {});
  }
  function maybeReload() {
    if (!newVersion || busy()) return;
    try { sessionStorage.setItem(UIKEY, JSON.stringify({ view: view, sel: sel, pickWeek: pickWeek, y: window.scrollY })); } catch (e) {}
    location.reload();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    flush(); refresh(true);
    if (newVersion) maybeReload(); else checkVersion();
  });

  window.CoachApp = { rowsFor: rowsFor, model: model, logs: function () { return logs; }, queue: function () { return queue; } };
  brand();
  setSync("");
  var ui = null;
  try { ui = JSON.parse(sessionStorage.getItem(UIKEY) || "null"); sessionStorage.removeItem(UIKEY); } catch (e) {}
  if (ui) { view = ui.view || view; sel = ui.sel || null; pickWeek = ui.pickWeek != null ? ui.pickWeek : null; }
  render();
  if (ui && ui.y) window.scrollTo(0, ui.y);
  refresh();
  flush();
})();
</script>
</body>
</html>
